version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: procurement_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-innovation_procurement}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d innovation_procurement"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurement_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_db_password}@db:5432/${POSTGRES_DB:-innovation_procurement}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-9a7c8df4f5a34cb2820d826a76ab68ea827cc2e1858a7e0a8d9b93e4f3a2c5a6}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-SankalpAdmin2026!}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
      - uploads:/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: procurement_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
