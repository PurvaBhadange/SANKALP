services:
  # FastAPI Backend Web Service
  - type: web
    name: sankalp-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sankalp-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 30
      - key: SEED_ADMIN_PASSWORD
        value: SankalpAdmin2026!
      - key: GEMINI_API_KEY
        sync: false

databases:
  # Managed PostgreSQL Database
  - name: sankalp-db
    databaseName: innovation_procurement
    user: postgres
    region: singapore
    plan: free
